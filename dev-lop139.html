<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Stopwatch</title>
<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
      integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
    padding: 20px;
}
.logo {
    text-align: center;
    margin-bottom: 15px;
}
.logo img {
    width: 180px;
    border-radius: 15px;
    box-shadow: 0 0 25px #ffd700;
}
.title {
    text-align: center;
    font-size: 44px;
    color: #ffd700;
    text-shadow: 0 0 25px #ffd700;
    margin-bottom: 40px;
}
.wrap {
    background: #1e1e1e;
    padding: 60px 50px;
    border-radius: 25px;
    box-shadow: 0 12px 50px rgba(255, 215, 0, 0.4);
    text-align: center;
    max-width: 550px;
    width: 100%;
}
#timer {
    position: relative;
    width: 350px;
    height: 350px;
    line-height: 350px;
    font-size: 48px;
    margin: 0 auto 30px;
    color: #ffd700;
    text-shadow: 0 0 20px #ffd700;
}
#timer span { display: inline-block; width: 70px; }
p {
    color: #ccc;
    font-size: 18px;
    margin-bottom: 35px;
}
.option a {
    display: inline-block;
    margin: 0 16px;
    text-decoration: none;
    width: 80px; height: 80px;
    line-height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    color: #121212;
    font-size: 32px;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    transition: transform 0.1s, box-shadow 0.2s;
}
.option a:hover { box-shadow: 0 0 40px rgba(255, 215, 0, 0.9); }
.option a:active { transform: scale(0.95); }
#timer svg {
    position: absolute; top: 0; left: 0; transform: rotate(-90deg);
}
.defaultCircle { fill: none; stroke: #555; stroke-width: 14; opacity: 0.3; }
.animateCircle {
    fill: none; stroke: #ffd700; stroke-width: 14; stroke-linecap: round;
    stroke-dasharray: 880; stroke-dashoffset: 880; transition: stroke-dashoffset 0.01s linear;
    filter: drop-shadow(0 0 10px #ffd700);
}
</style>
</head>
<body>

<div class="logo">
    <img src=" Image 2025-10-24 at 07.16.52.jpeg" alt="Logo">
</div>

<div class="title">Stopwatch</div>

<div class="wrap">
    <div id="timer">
        <svg width="350" height="350">
            <circle class="defaultCircle" cx="175" cy="175" r="150"></circle>
            <circle class="animateCircle" cx="175" cy="175" r="150"></circle>
        </svg>
        <span id="hours">00</span> :
        <span id="minutes">00</span> :
        <span id="seconds">00</span> :
        <span id="milliseconds">00</span>
    </div>
    <p>Your time starts now</p>
    <div class="option">
        <a id="play" href="javascript:void(0)"><i class="fa fa-play"></i></a>
        <a id="reset" href="javascript:void(0)"><i class="fa fa-undo"></i></a>
    </div>
</div>

<script>
$(document).ready(function () {
    let running = false, startTime, elapsedTime = 0, interval;
    const duration = { h: 0, m: 0, s: 0, ms: 0 };
    const circle = document.querySelector(".animateCircle");
    const circleLength = 2 * Math.PI * 150;
    circle.style.strokeDasharray = circleLength;
    circle.style.strokeDashoffset = circleLength;

    function pad(num, size = 2){ return ("00" + num).slice(-size); }

    function updateDisplay(){
        duration.h = Math.floor(elapsedTime / 3600000);
        duration.m = Math.floor((elapsedTime % 3600000) / 60000);
        duration.s = Math.floor((elapsedTime % 60000) / 1000);
        duration.ms = Math.floor((elapsedTime % 1000)/10);
        $("#hours").text(pad(duration.h));
        $("#minutes").text(pad(duration.m));
        $("#seconds").text(pad(duration.s));
        $("#milliseconds").text(pad(duration.ms));
        let progress = (duration.s + duration.ms / 100) / 60;
        circle.style.strokeDashoffset = circleLength * (1 - progress);
    }

    function startTimer(){
        startTime = new Date();
        interval = setInterval(function(){
            const currentTime = new Date();
            elapsedTime += currentTime - startTime;
            startTime = currentTime;
            updateDisplay();
        }, 10);
    }

    function stopTimer(){ clearInterval(interval); }

    $("#play").click(function(){
        if(running){ stopTimer(); $(this).html('<i class="fa fa-play"></i>'); }
        else{ startTimer(); $(this).html('<i class="fa fa-pause"></i>'); }
        running = !running;
    });

    $("#reset").click(function(){
        stopTimer(); running = false; elapsedTime = 0;
        $("#play").html('<i class="fa fa-play"></i>');
        updateDisplay();
    });
});
</script>
</body>
</html>

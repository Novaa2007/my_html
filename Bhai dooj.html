<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhai Dooj Celebration</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(120deg, #ffe3e3, #fff0f5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      transition: all 0.3s ease-in-out;
    }

    @media (max-width: 768px) {
      .card {
        grid-template-columns: 1fr;
      }
    }

    .left {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: #fff;
      padding: 50px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .left h1 {
      font-size: 48px;
      line-height: 1.1;
    }

    .left p {
      margin-top: 15px;
      font-size: 16px;
      opacity: 0.9;
    }

    .btn {
      margin-top: 25px;
      background: #fff;
      color: #ff4b7d;
      border: none;
      padding: 12px 25px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ffd6e8;
      transform: translateY(-2px);
    }

    .right {
      background: url('https://i.imgur.com/7vLM8EX.png') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #fff;
      padding: 20px;
      position: relative;
    }

    .right::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 75, 125, 0.4);
    }

    .right h2 {
      position: relative;
      z-index: 2;
      font-size: 28px;
      font-weight: 700;
    }

    .right p {
      position: relative;
      z-index: 2;
      font-size: 16px;
      margin-top: 8px;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="left">
      <h1>Happy<br>Bhai Dooj!</h1>
      <p>May the bond of love between brother and sister remain forever strong. Wishing you joy, prosperity, and endless happiness on this auspicious day.</p>
      <button class="btn">Celebrate with Love 💫</button>
    </div>
    <div class="right">
      <h2>Bhai Dooj 2025</h2>
      <p>October 29, 2025 • Family & Festivity</p>
    </div>
  </div>

  <footer>Made with ❤️ by Himanshu</footer>
</body>
</html>
